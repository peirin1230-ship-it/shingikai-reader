- key: keizai-jousei-kanja-futan
  title: 経済情勢に対応した患者負担等の見直し
  status: 検討中（改革工程 2028年度まで。骨太2026で歳出の目安の立て方自体が変更）
  summary: |
    物価・賃金の上昇を、患者負担の水準（高額療養費の自己負担限度額、入院時の食費の基準）に
    どう反映させるか。金額で定めた負担は据え置けば実質的に軽くなる、という論点。
  history:
    - { date: 2023-12-22, event: 改革工程の「高齢者の活躍促進や健康寿命の延伸等」欄に位置付け, slide: hoken-215-sanko-p083 }
    - { date: 2026-07-21, event: 骨太2026 注120が社会保障関係費に「経済・物価動向等を踏まえた対応に相当する増加分」の加算を明記, document: honebuto-2026 }
  related_terms: [高額療養費]
  watch: |
    スライド54・55（消費者物価指数・賃金の長期トレンド）とスライド56（医療関係職種の給与の推移）が
    この論点の材料として置かれている。いずれも第三者（JILPT）の図であることに注意。

    ★この論点は、患者負担の水準だけの話ではなくなっている。
    骨太2026 注120は「社会保障関係費については、給付と負担の改革努力を継続しつつ、
    高齢化による増加分に相当する伸びに経済・物価動向等を踏まえた対応に相当する増加分を
    加算する」とし、**歳出の目安の立て方そのものを変えた**。
    スライド75の令和8年度「+0.77兆円程度」はこの結果である。
    物価上昇を抑制側だけでなく加算側にも効かせる整理になった点が、
    平成25〜30年度の「年+0.5兆円程度」との違いである【解釈】。
  evidence_slides: []

- key: gairai-tokurei-minaoshi
  title: 外来特例の見直し
  status: 検討中（骨太2026 注126が見直し対象として名指し。令和8年末までに一定の結論）
  summary: |
