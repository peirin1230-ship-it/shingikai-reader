    - { date: 2026-06-05, event: 令和8年法律第31号 公布。長期療養者への配慮を法律上明確化, slide: hoken-215-sanko-p082 }
    - { date: 2026-08-01, event: 同規定の施行, slide: hoken-215-sanko-p082 }
