- key: geneki-sedai-futan-keigen
  title: 現役世代の負担軽減
  status: 継続課題（骨太2026「保険料率の上昇を止め、引き下げていく」。2027年度の社会保障負担率を2025年度比で上昇させない）
  summary: |
    協会けんぽ・健保組合が拠出する後期高齢者支援金・前期高齢者納付金の重さを
    どう抑えるか。高齢者負担率、総報酬割、財政調整の設計がすべてここに効いてくる。
  history:
    - { date: 2010, event: 後期高齢者支援金に総報酬割（1/3）導入, slide: hoken-215-sanko-p076 }
    - { date: 2017, event: 全面総報酬割, slide: hoken-215-sanko-p076 }
    - { date: 2024, event: 前期高齢者財政調整に報酬水準を勘案／高齢者負担率の見直し, slide: hoken-215-sanko-p076 }
    - { date: 2025-10-20, event: 連立政権合意書が「現役世代の保険料率の上昇を止め、引き下げていく」ことを目標に掲げる, document: renritsu-goi-2025 }
    - { date: 2026-07-07, event: 骨子 項目1が令和9年度の社会保障負担率を令和7年度比で上昇させないと明記, document: shakaihosho-koshi-2026 }
    - { date: 2026-07-21, event: 骨太2026が同じ内容を採用, document: honebuto-2026 }
  related_terms: [後期高齢者支援金, 前期高齢者財政調整制度, 総報酬割, 高齢者負担率, 協会けんぽ]
  watch: |
    骨太2026は「現役世代の保険料率の上昇を止め、引き下げていくことを目指す」とし、
    「2027年度の社会保障負担率が2025年度と比較して上昇しないよう取り組む」と年度を切った。
    高齢者の窓口負担見直しも「現役世代の負担軽減の観点からの公費負担のあり方とともに
    総合的に検討」とされており、**高齢者負担・公費・現役世代の保険料の3つが
    1つのパッケージとして動く**構図になっている【解釈】。
  evidence_slides: []

