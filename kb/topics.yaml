- key: koreisha-teigi-minaoshi
  title: 「高齢者」の定義見直し
  status: 検討中（骨子 項目5。改革工程表を令和8年度末までに策定）
  summary: |
    社会保障・労働分野の制度ごとに設けられている高齢者の年齢区分を制度横断的に総点検し、
    必要に応じて引き上げ等を行う方向で検討する。
  history:
    - { date: 2025-10-20, event: 連立政権合意書の13項目に「年齢に関わらず働き続けることが可能な社会を実現するための『高齢者』の定義見直し」, document: renritsu-goi-2025 }
    - { date: 2026-07-07, event: 骨子 項目5が制度横断的な総点検と改革工程表の策定を明記, document: shakaihosho-koshi-2026 }
  related_terms: [後期高齢者医療制度, 前期高齢者財政調整制度]
  watch: |
    医療保険では75歳（後期高齢者）・70歳・65歳（前期高齢者）が区切りになっている。
    定義が動けば、後期高齢者医療制度の対象年齢、前期高齢者財政調整の範囲、
    窓口負担の年齢区分がまとめて動きうる【解釈】。
    骨太2026 注126の「年齢の引き上げ」もこの論点と地続きである。
    ★スライド73（高齢者の就業率の推移）とスライド7・8（健康寿命）が根拠側の材料になる。
  evidence_slides: []

