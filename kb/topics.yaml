    - { date: 2017, event: 70歳以上の限度額引上げ（制度改正による減▲220億円）, slide: hoken-215-sanko-p076 }
    - { date: 2018, event: 現役並世帯の所得区分細分化・一般区分の外来上限額引上げ, slide: hoken-215-sanko-p076 }
