- key: koreisha-futan
  title: 高齢者負担の在り方
  status: 検討中（骨太2026により令和8年末までに一定の結論・改革工程表の策定）
  summary: |
    高齢者の窓口負担割合をどこまで現役世代に近づけるか。1割・2割・3割の区分と
    その判定基準（課税所得・年金収入・金融所得・金融資産）の設計が論点。
  history:
    - { date: 1973-01, event: 老人医療費支給制度。高齢者の窓口負担なし, slide: hoken-215-sanko-p077 }
    - { date: 1983-02, event: 老人保健制度。定額負担を導入, slide: hoken-215-sanko-p077 }
    - { date: 2002-10, event: 現役並み所得者2割。所得の軸が入る, slide: hoken-215-sanko-p077 }
    - { date: 2008-04, event: 後期高齢者医療制度。75歳以上1割（現役並み3割）, slide: hoken-215-sanko-p077 }
    - { date: 2022-10, event: 75歳以上の一定以上所得者に2割負担, slide: hoken-215-sanko-p076 }
    - { date: 2023-12-22, event: 改革工程が3割負担の判断基準設定を2028年度までの検討課題に, slide: hoken-215-sanko-p083 }
    - { date: 2025-10-20, event: 連立政権合意書が13項目の1つとして「医療費窓口負担に関する年齢によらない真に公平な応能負担の実現」を掲げる, document: renritsu-goi-2025 }
    - { date: 2026-07-07, event: 骨子 項目4が令和8年末までの改革工程表策定と一定の結論を明記, document: shakaihosho-koshi-2026 }
    - { date: 2026-07-21, event: 骨太2026が骨子 項目4をほぼ逐語で採用（本文・注126）, document: honebuto-2026 }
  related_terms: [現役並み所得者, 一定以上所得者, 後期高齢者医療制度]
  watch: |
    スライド35（年齢階級別一人当たり医療費と自己負担額）が「70代以降は医療費が高額に
    なるにもかかわらず自己負担は低く抑えられている」を太字下線で強調しており、
    負担引上げ論の直接の論拠として置かれている。
    一方でスライド71は75歳以上個人の収入の平均と中央値の乖離を示しており、
    同じ資料の中に反対方向にも読める材料がある。

    ★骨太2026 注126は、検討にあたって踏まえるものを次のように列挙している。
      高齢者の就業率の上昇／健康寿命の延伸／医療費水準や受診状況の動向／
      高齢者に低所得が多いといった家計の状況
    そして見直しの対象として「外来特例の在り方」「負担割合の区切りとなる所得の見直し」
    「年齢の引き上げ」を名指ししている。
    この列挙は第215回参考資料のスライド構成とほぼ一対一で対応する。
      就業率 → p073 ／ 健康寿命 → p007・p008 ／ 医療費水準・受診状況 → p035・p013・p071 ／
      家計の状況 → p071・p072・p070
    **基礎資料のスライド選定そのものが、この検討項目に沿って作られていると読める**【解釈】。

    ★なおこの列挙の出どころは閣議決定ではない。
    「社会保障改革項目に関する具体的な骨子」（令和8年7月7日 自民・維新 社会保障制度改革協議体）
    の項目4に同じ文言があり、骨太2026がそれを引き写している。
    さらに遡ると連立政権合意書（令和7年10月20日）の13項目に行き着く。
    **期限（令和8年末）を置いたのは政党間の合意であって、審議会でも閣議決定でもない**【事実】。
  evidence_slides: []

- key: kinyu-shotoku
  title: 医療保険における金融所得の勘案
  status: 施行待ち（令和8年法律第31号 1.②。公布後5年以内の政令で定める日に施行）
  summary: |
    上場株式の配当等の金融所得を、保険料の算定や窓口負担割合等の判定に反映する。
    後期高齢者医療制度から導入する。
  history:
    - { date: 2023-12-22, event: 改革工程が「医療・介護保険における金融所得の勘案や金融資産等の取扱い」を2028年度までの検討課題に, slide: hoken-215-sanko-p083 }
    - { date: 2026-06-05, event: 令和8年法律第31号 公布。法定調書のオンライン提出義務等を整備, slide: hoken-215-sanko-p082 }
    - { date: 2026-07-21, event: 骨太2026が「金融所得・資産の扱い」と資産まで含めて記載, document: honebuto-2026 }
  related_terms: [金融所得の勘案, 後期高齢者医療制度]
  watch: |
    施行が公布後5年以内と最も遅い。金融機関から広域連合への情報連携基盤の整備に
    時間を要するためと読める【解釈】。
    改革工程は「金融資産等の取扱い」もあわせて挙げているが、令和8年改正法に入ったのは
    金融「所得」までであり、資産の勘案は積み残しである。
    骨太2026も「金融所得・資産の扱い」と資産を併記したうえで、注126で
    「マイナンバー制度を活用した所得・資産情報の把握基盤の整備を早急に進め、
    制度への反映を進める」としている。資産の勘案は基盤整備の進み方に依存する【解釈】。
  evidence_slides: []

