    - { date: 2023-12-22, event: 改革工程が国保の普通調整交付金の医療費勘案等を2028年度までの検討課題に, slide: hoken-215-sanko-p083 }
    - { date: 2026-07-07, event: 骨子 項目2が保険者の再編統合・国保保険料水準の完全統一の前倒し・後期高齢者医療の運営主体の見直しを明記, document: shakaihosho-koshi-2026 }
  related_terms: [総報酬割, 前期高齢者財政調整制度, 前期高齢者交付金, 保険料水準統一加速化プラン]
