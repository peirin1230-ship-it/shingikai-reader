# 改革論点マスタ
#
# 基礎資料のスライドは、それ自体は事実の羅列で、どの論点の論拠になるかを語らない。
# スライド側の supports_topics からここへ逆引きを張るための台帳である（SPEC §2.3）。
#
# ★ evidence_slides は build.py がスライドの supports_topics から逆生成する。手書きしない。
#   ここに書いても上書きされる。
#
# title がスライドの supports_topics に書く値そのものである（キーではなく日本語表記で参照する）。
# 表記ゆれは validate.py が未解決参照として検出する。
#
# status の書き方
#   実施済み  : 施行まで終わっているもの
#   施行待ち  : 法律は成立し、施行日待ちのもの
#   検討中    : 改革工程等で検討課題に挙がっているが法案になっていないもの

- key: otc-ruijiyaku
  title: OTC類似薬の保険給付の見直し
  status: 施行待ち（令和8年法律第31号 1.①。公布後1年以内の政令で定める日に施行）
  summary: |
    OTC医薬品との代替性が特に高い薬剤を用いた療養等について、薬剤費の一部を
    保険給付の対象外とする「一部保険外療養」を設ける。第215回の議題①はその実施方法。
  history:
    - { date: 2024, event: 長期収載品の選定療養を創設。保険給付の範囲を動かす先例ができる, slide: hoken-215-sanko-p076 }
    - { date: 2026-06-05, event: 令和8年法律第31号 公布。一部保険外療養を創設, slide: hoken-215-sanko-p082 }
    - { date: 2026-09-03, event: 第214回部会でOTC類似薬の見直しの実施に関するヒアリング }
    - { date: 2025-10-20, event: 連立政権合意書が「OTC類似薬を含む薬剤自己負担の見直し」を掲げる, document: renritsu-goi-2025 }
    - { date: 2026-07-07, event: 骨子 項目7が「一部保険外療養と民間保険の相互補完」を検討対象に含める, document: shakaihosho-koshi-2026 }
    - { date: 2026-07-21, event: 骨太2026が「2027年度以降の対象範囲の拡大に向けた検討」を明記, document: honebuto-2026 }
    - { date: 2026-09-11, event: 第215回部会 議題①「OTC類似薬の保険給付の見直しの実施について」 }
  related_terms: [一部保険外療養, 長期収載品, 選定療養, 保険外併用療養費]
  watch: |
    対象薬剤の線引き（「代替性が特に高い」の判定）、患者負担の算定方法、
    長期処方を要する患者への配慮が実施上の焦点になると見込まれる【推測】。
    ★骨太2026は、施行前の段階ですでに「2027年度以降の対象範囲の拡大に向けた検討」を
    書いている。第215回の議論は「どう実施するか」と同時に「次にどこまで広げるか」の
    地ならしでもある【解釈】。
    さらに骨子 項目7は、公的保険と民間保険の役割分担の検討に
    「一部保険外療養と民間保険の相互補完を含む」と書いている。
    保険給付から外した部分を民間保険が拾う構図が検討対象に入っており、
    財務省・厚労省・金融庁を含む関係省庁で検討するとされている。
    **医療保険部会だけで完結する論点ではない**【事実】。
  evidence_slides: []

