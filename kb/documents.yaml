  # 13項目。医療保険部会に直接関わるものに ★ を付けた
  reform_items:
    - { no: 1,  title: 保険財政健全化策推進（インフレ下での医療給付費の在り方と、現役世代の保険料負担抑制との整合性を図るための制度的対応）, hoken_bukai: true }
    - { no: 2,  title: 医療介護分野における保険者の権限及び機能の強化並びに都道府県の役割強化, hoken_bukai: true }
    - { no: 3,  title: 病院機能の強化、創薬機能の強化、患者の声の反映及びデータに基づく制度設計を実現するための中央社会保険医療協議会の改革, hoken_bukai: false }
    - { no: 4,  title: 医療費窓口負担に関する年齢によらない真に公平な応能負担の実現, hoken_bukai: true }
    - { no: 5,  title: 年齢に関わらず働き続けることが可能な社会を実現するための「高齢者」の定義見直し, hoken_bukai: true }
    - { no: 6,  title: 人口減少下でも地方の医療介護サービスが持続的に提供されるための制度設計, hoken_bukai: false }
    - { no: 7,  title: 国民皆保険制度の中核を守るための公的保険の在り方及び民間保険の活用に関する検討, hoken_bukai: true }
    - { no: 8,  title: 大学病院機能の強化（教育、研究及び臨床を行う医療従事者として適切な給与体系の構築等）, hoken_bukai: false }
    - { no: 9,  title: 高度機能医療を担う病院の経営安定化と従事者の処遇改善（診療報酬体系の抜本的見直し）, hoken_bukai: false }
    - { no: 10, title: 配偶者の社会保険加入率上昇及び生涯非婚率上昇等をも踏まえた第3号被保険者制度等の見直し, hoken_bukai: false }
    - { no: 11, title: 医療の費用対効果分析に係る指標の確立, hoken_bukai: false }
    - { no: 12, title: 医療機関の収益構造の増強及び経営の安定化を図るための医療機関の営利事業の在り方の見直し, hoken_bukai: false }
    - { no: 13, title: 医療機関における高度医療機器及び設備の更新等に係る現在の消費税負担の在り方の見直し, hoken_bukai: false }

  key_points:
    - topic: 高齢者負担の在り方
      item: 4
      quote: |
        70歳以上の高齢者の医療費窓口負担割合について（中略）年齢によらない真に公平な応能負担を
        実現する観点から見直しを行う。そのための改革工程表を令和8年末までに策定する
      note: |
        ★骨太2026の本文と注126は、この項目のほぼ逐語再掲である。
        踏まえる材料として挙げられているのも同じ（高齢者の就業率の上昇／健康寿命の延伸／
        医療費水準や受診状況の動向／高齢者に低所得が多いといった家計の状況）で、
        見直し対象も同じ（外来特例の在り方／負担割合の区切りとなる所得の見直し／年齢の引き上げ）。
        **つまり高齢者窓口負担の論点の出どころは閣議決定ではなく、この政党間合意である。**

    - topic: 現役世代の負担軽減
      item: 1
      quote: 令和9年度の社会保障負担率が令和7年度と比較して上昇しないよう取り組む
      note: |
        骨太2026の「2027年度の社会保障負担率が2025年度と比較して上昇しないよう取り組む」と同じ。
        医療費適正化計画の次期改定に向けた抜本的な見直しも、この項目に書かれている。

    - topic: 保険者間の負担調整
      item: 2
      quote: |
        国民健康保険における都道府県内の保険料水準の完全統一及び市町村の事務負担軽減や
        後期高齢者医療制度の運営主体のあり方などの保険者の再編統合
      note: |
        国保の完全統一は、令和9年度に予定されている国保運営方針の中間改定で
        全都道府県が具体的な実現時期を明記するとし、現行「遅くとも令和18年度まで」の
        完全統一時期を前倒しするとしている。
        後期高齢者医療制度の運営主体の在り方は令和10年末までに結論。
        ★スライド79（保険料水準の統一の進捗状況）はこの論点の現状を示す一枚。

    - topic: OTC類似薬の保険給付の見直し
      item: 7
      quote: |
        公的保険を補完する民間保険の活用可能性、先進医療等の対象拡大、
        民間保険による補完が有効な領域（一部保険外療養と民間保険の相互補完を含む）
      note: |
        ★一部保険外療養を民間保険で補完する構図が検討対象に入っている。
        財務省・厚労省・金融庁を含む関係省庁で検討するとされており、
        医療保険部会だけで完結する論点ではない。

