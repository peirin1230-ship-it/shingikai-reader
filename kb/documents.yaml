- key: kaikaku-kotei-2023
  type: 閣議決定
  title: 全世代型社会保障構築を目指す改革の道筋（改革工程）
  date: 2023-12-22
  era: 令和5年12月22日
  issuer: 政府（全世代型社会保障構築本部）
  summary: |
    改革課題を3つの「時間軸」に割り付けた工程表。
    ①2024年度に実施する取組、②加速化プランの実施が完了する2028年度までに実施について
    検討する取組、③2040年頃を見据えた中長期的な取組。
    ②は2028年度までの各年度の予算編成過程で実施すべき施策を検討・決定するとされている。
  # 厚労省保険局が医療保険部会向けに抜粋した版。医療保険部会の議論で参照されるのはこの範囲
