- key: santo-goi-2025-06-06
  type: 政党間合意
  title: 自由民主党、公明党、日本維新の会 合意（医療法等改正案に関するもの）
  date: 2025-06-06
  era: 令和7年6月6日
  issuer: 自由民主党・公明党・日本維新の会
  license: party
  summary: |
    連立政権合意書が「医療法に関する三党合意書」と呼んでいるものにあたる【解釈】。
    本文は4項目で、(1)病床再編の拡大と(2)医療DXの加速化の2点を実現するとし、
    それを踏まえて政府提出の「医療法等の一部を改正する法律案」を修正のうえ
    本年（令和7年）の国会で成立させる、という構成をとる。
    別紙に日本維新の会による病床削減の試算がある。
    6月11日の合意（santo-goi-2025-06。OTC類似薬等）とは別の文書である。
  url: https://ajhc.or.jp/siryo/20250606_3g.pdf
  sha256: 64e4bb4e7949ffa0ad7d329f8649702676981fab533479494226aa278e2faccc
  bytes: 219919
  pages: 6
  fetched_at: 2026-09-14
  verified: true
  url_note: |
    ★これは公益社団法人 全日本病院協会が掲載している版であり、政党の公式配布元ではない。
    政党サイト上の原典は見つけられなかった（2026年9月時点）。
    取得したファイルのSHA256は記録してあるが、公式版との同一性は未確認【要確認】。
    PDFはMFPによるスキャンでテキスト層がない（作成日時 2025-06-06、A4・6ページ）。
    構成は 1ページ目=表題と3党の署名、2ページ目=白紙に近い、3〜4ページ目=本文1〜4、
    5〜6ページ目=別紙（試算）。
    ★本文はスキャン画像を目視で読んだ。OCR（tesseract）は精度が低く使えなかったため、
    数値はすべて【要確認】扱いとし、人による原典照合が済むまで確定値としない。
  key_points:
    - topic: 医療提供体制
      quote: |
        人口減少等により不要となると推定される、約11万床（※1）の一般病床・療養病床・
        精神病床といった病床について、地域の実情を踏まえた調査を行った上で、
        2年後の新たな地域医療構想に向けて、不可逆的な措置を講じつつ、
        調査を踏まえて次の地域医療構想までに削減を図ることとし、
        その旨を骨太の方針に明記する。
      note: |
        ※1は「一般病床及び療養病床の必要病床数を超える病床数約5万6千床並びに
        精神病床の基準病床数を超える病床数約5万3千床を合算した病床数（厚生労働省調べ）」。
        削減の期限は「2年後の新たな地域医療構想に向けて」ではなく
        「次の地域医療構想までに」である点に注意【事実】。
        あわせて「感染症等に対応する病床は確実に確保しつつ、削減される病床の区分や
        病床の稼働状況、代替する在宅・外来医療等の増加等を考慮した上で、精査を行う」
        という留保が本文に置かれている。
    - topic: 医療費適正化
      quote: |
        当該削減が実現した際には、「一定の合理性のある試算」（※2）に基づけば、
        約1兆円の医療費削減効果と計算されるなど、
        一定規模の入院医療費の削減効果が期待できる。
      note: |
        ★「約1兆円」は年額ではなく2年分の純額である【事実】。
        別紙の試算は 削減総額 約7,000億円/年 − 必要予算額 約2,400億円/年
        ＝ 適正化効果額 約4,600億円/年 ≒ 5千億円/年（約1兆円/2年）としている。
        二次情報ではこの区別が落ちることがあるので、引用するときは注意が要る【解釈】。
    - topic: 医療DX
      quote: |
        現時点の電子カルテ普及率が約50%であることに鑑み、普及率約100%を達成するべく、
        5年以内の実質的な実現を見据え電子カルテを含む医療機関の電子化を実現する。
        また（中略）電子カルテを通じた医療情報の社会保険診療報酬支払基金に対する
        電磁的提供を実現する。
      note: |
        第215回 資料2 p015（日本成長戦略）の目標
        「2030年までに電子カルテ普及率約100%」は、この合意の5年以内という期限と
        整合する【解釈】。出発点の約50%を書いているのはこの合意のほうで、
        日本成長戦略には現在の普及率が書かれていない。
    - topic: 改革経緯
      quote: |
        上記を踏まえ、政府提出の「医療法等の一部を改正する法律案」に対し、
        上記の病床再編の拡大及び医療DXの加速化について、
        本則及び附則において所要の修正を行った上で、本年の国会における成立を図る。
      note: |
        ★この合意は法案修正を条件とした成立協力の合意である【解釈】。
        本文4は「本合意について、3党は、政府提出の『医療法等の一部を改正する法律案』の
        本年における成立に限定して責任をもって努力することとする」と範囲を限定している。
    - topic: 現役世代の負担軽減
      quote: |
        引き続き3党の協議体において、現役世代の保険料負担を含む国民負担の軽減を
        実現するため、社会保障改革に関する真摯な協議を継続する。
      note: |
        『自由民主党、公明党、日本維新の会 合意』（令和7年2月25日。santo-goi-2025-02）に
        基づき、令和7年末までの予算編成過程（診療報酬改定を含む）で論点を検討し、
        早期に実現が可能なものは令和8年度から実行に移すとしている。
        6月11日の合意（santo-goi-2025-06）がこの「協議の継続」の成果にあたる【解釈】。
  betsushi:
    title: 【別紙】医療需要等の変化を踏まえた一定の合理性のある試算（厚生労働省の調査に基づく日本維新の会の試算）
    note: |
      ★この試算は厚生労働省ではなく日本維新の会が作成したものである【事実】。
      表題に明記されている。本文※2が参照する「一定の合理性のある試算」がこれにあたる。
      以下の数値はすべてスキャン画像からの読み取りであり【要確認】。
    hitsuyo_yosan:
      - 削減し得る病床の総計: 一般・療養で必要病床数を超える約5万6千床＋精神で基準病床数を超える約5万3千床＝約11万床（厚生労働省調べ）
      - 加速化の前提: 約11万床を2年間で効率化する場合、5.5万床/年の適正化が必要
      - A 病床の削減: 1床あたり約410万円（4,104千円）の給付金（令和6年度補正予算事業を参照）。5.5万床/年 × 410万円 = 2,255億円/年
      - B 病棟の機能転換: 病棟あたり2千万円と仮定。対象約250病棟。250 × 2千万円 = 50億円/年
      - C 医療機関の業態変更: 1病院あたり2千万円と仮定。対象約250病院。250 × 2千万円 = 50億円/年
      - 合計: A+B+C = 2,355億円/年 ≒ 約2,400億円/年（4,800億円/2年）
    tekiseika_kouka:
      - 一般病院1床あたり医業収益: 22,932千円/床年 ≒ 2,300万円/床年
      - ケアミックス病院1床あたり医業収益: 14,255千円/床年 ≒ 1,400万円/床年
      - 一般＋ケアミックス: (2,300+1,400)万円÷2 × (5.6万床÷2) = 5,180億円/年
      - 精神病院1床あたり医業収益: 7,049千円/床年 ≒ 700万円/床年
      - 精神: 700万円 × (5.3万床÷2) = 1,855億円/年
      - 削減総額: 5,180 + 1,855 = 7,035億円/年 ≒ 7,000億円/年 ≒ 1.4兆円/2年
      - 適正化効果額（最大）: 7,000 − 2,400 = 4,600億円/年 ≒ 5千億円/年（約1兆円/2年）
    caution: |
      ★読むときの注意（本解説による）【解釈】
      1. 削減効果を「1床あたりの医業収益」で置いている。病床を減らした分の医業収益が
         そのまま医療費の減少になるという前提であり、患者が在宅・外来に移った場合の
         費用は差し引かれていない。本文自身が「代替する在宅・外来医療等の増加等を
         考慮した上で、精査を行う」としており、この試算はその精査の前の数字である【事実】。
      2. 医業収益は病院の収入であって保険給付費とは範囲が異なる（自費・補助金等を含む）。
         試算はこの差を調整していない【解釈】。
      3. 年額と2年分が混在している。本文の「約1兆円」は2年分の純額である。
      4. 5.6万床・5.3万床をそれぞれ2で割って年額を出し、それを2倍して2年分としている。
         2年目には1年目の削減分も効いているはずなので、この置き方は
         積み上がりを見ていない可能性がある【推測】。原典に説明はない。
  slides: []
  topics:
    - 医療費適正化
    - 現役世代の負担軽減

