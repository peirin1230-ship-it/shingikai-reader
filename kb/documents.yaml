- key: honebuto-2026
  type: 閣議決定
  title: 経済財政運営と改革の基本方針2026
  subtitle: 「責任ある積極財政」元年 〜日本の挑戦を起動する！〜
  date: 2026-07-21
  era: 令和8年7月21日 閣議決定
  issuer: 内閣府（経済財政諮問会議）
  summary: |
    いわゆる骨太の方針。第3章「責任ある積極財政に基づく『中長期経済財政計画』」の
    2.「全世代型社会保障の構築」に、医療保険部会の論点がそのまま並んでいる。
    第215回の資料2「次期医療保険制度改革に向けて」は、この抜粋から始まっている。
  url: https://www5.cao.go.jp/keizai-shimon/kaigi/cabinet/honebuto/2026/2026_basicpolicies_ja.pdf
  sha256: 1c1552510486b9a30c72a643b279618721e8bd66dc522cc705a44d379a227a4a
  bytes: 821017
  pages: 42
  fetched_at: 2026-09-14
  verified: true
  url_note: 本文。社会保障は第3章2.（27〜30ページ）
  related_urls:
    - { title: 概要（1枚）, url: "https://www5.cao.go.jp/keizai-shimon/kaigi/cabinet/honebuto/2026/summary_ja.pdf" }
    - { title: 政策ファイル, url: "https://www5.cao.go.jp/keizai-shimon/kaigi/cabinet/honebuto/2026/seisakufile_ja.pdf" }
    - { title: 経済財政運営と改革の基本方針2026（内閣府）, url: "https://www5.cao.go.jp/keizai-shimon/kaigi/cabinet/honebuto/2026/decision0721.html" }
    - { title: 骨太の方針 各年度一覧, url: "https://www5.cao.go.jp/keizai-shimon/kaigi/cabinet/honebuto/honebuto-index.html" }

  # 医療保険部会に直接効く記述。いずれも本文からの引用
  key_points:
    - topic: 現役世代の負担軽減
      quote: 現役世代の保険料率の上昇を止め、引き下げていくことを目指す
      note: |
        あわせて「2027年度の社会保障負担率が2025年度と比較して上昇しないよう取り組む」
        「社会保障負担率の目標の検討を進め」るとし、2026年度中に改革項目の具体化と
        工程の明確化を図るとしている。

    - topic: 高齢者負担の在り方
      quote: |
        70歳以上の高齢者の医療費窓口負担割合について、低所得者等の必要な受診が確保される
        よう適切に配慮することを前提として、原則3割となっている現役世代との間で年齢に
        よらない真に公平な応能負担を実現する観点から見直しを行う。
        そのための改革工程表を2026年末までに策定する
      note: |
        ★注126が、何を踏まえて検討するかを列挙している。
        「高齢者の就業率の上昇や健康寿命の延伸、医療費水準や受診状況の動向、
        高齢者に低所得が多いといった家計の状況等も踏まえ、必要な受診が確保されるよう
        適切な配慮措置を講じつつ、外来特例の在り方や、負担割合の区切りとなる所得の見直し、
        年齢の引き上げなど窓口負担の抜本的な見直しについて、現役世代の負担軽減の観点からの
        公費負担のあり方とともに総合的に検討を行い、その速やかな実現について
        令和8年末までに一定の結論を得る。」
        この列挙は、第215回参考資料のスライド選定とほぼ一対一で対応する（各スライドの解説を参照）。

    - topic: OTC類似薬の保険給付の見直し
      quote: |
        OTC類似薬の保険給付の見直しの施行とその状況等を踏まえた2027年度以降の
        対象範囲の拡大に向けた検討
      note: 令和8年法律第31号で創設した一部保険外療養を、施行前から拡大方向で検討すると書いている。

    - topic: 医療保険における金融所得の勘案
      quote: 医療・介護保険における金融所得・資産の扱い
      note: |
        「資産」も並べている点が令和8年法律第31号（金融所得のみ）との差。
        注126は「マイナンバー制度を活用した所得・資産情報の把握基盤の整備を早急に進め、
        制度への反映を進める」としている。

    - topic: 医療費適正化
      quote: |
        医療給付費の対GDP比や雇用者報酬の伸びとの関係などを参照しつつ、
        医療費適正化計画の次期改定に向けて抜本的な見直しを行うことを含め、改革を継続する
      note: 注119。医療費適正化計画（第4期は2024-2029年度）の次期改定が対象。

    - topic: 経済情勢に対応した患者負担等の見直し
      quote: |
        社会保障関係費については、給付と負担の改革努力を継続しつつ、高齢化による増加分に
        相当する伸びに経済・物価動向等を踏まえた対応に相当する増加分を加算する
      note: |
        注120。★参考資料スライド75（社会保障関係費の伸び）の令和8年度「+0.77兆円程度」
        「経済・物価動向等を踏まえた対応による増加分0.29兆円を加算」の根拠がこれ。
        歳出の目安の立て方そのものが変わったことを示す記述である。

