    title: 被用者家族の入院負担を3割から2割へ
    category: 患者負担
    summary: 被用者家族の入院給付率を引き上げ、入院2割負担とした。
    source_slides: [hoken-215-sanko-p077]
    confidence: high

  # ========================= 老人保健制度 =========================
  - id: t-1983-02-rojin-hoken
    date: "1983-02"
    date_precision: month
