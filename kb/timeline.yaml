    category: 給付
    summary: 出産育児一時金の費用の一部を後期高齢者医療制度が負担する仕組みが入った。
    detail: |
      高齢者医療を現役世代が支える流れに対し、高齢者側から次世代を支える流れを付けた改正。
      「全世代型」という整理の具体例として引かれることが多い。
    law: 令和5年法律第31号
