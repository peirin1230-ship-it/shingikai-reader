    date: "2018"
    date_precision: fiscal_year
    era: 平成30年度
    title: 70歳以上の現役並世帯の所得区分細分化／一般区分の外来上限額引上げ
    category: 患者負担
    summary: 70歳以上の高額療養費について、現役並世帯を細分化し、一般区分の外来特例を引き上げた。
