  - id: t-2022-10-ittei-ijo-2wari
    date: "2022-10"
    date_precision: month
    era: 令和4年10月／令和4年度
    title: 75歳以上の一定以上所得者に2割負担を導入
    category: 患者負担
    summary: 課税所得28万円かつ「年金収入＋その他の合計所得金額」200万円以上（現役並みを除く）が対象。
    detail: |
      後期高齢者医療制度の窓口負担に、1割・2割・3割の3区分ができた。
      スライド75によれば、令和4年度の制度改正による減のうち
      「後期高齢者医療の患者負担割合見直し（▲300億円）」がこれにあたる。
    source_slides: [hoken-215-sanko-p076, hoken-215-sanko-p077, hoken-215-sanko-p075]
    topics: [高齢者負担の在り方, 現役世代の負担軽減]
    terms: [一定以上所得者]
