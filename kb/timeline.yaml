  # ========================= 全世代対応型改正と改革工程 =========================
  - id: t-2023-05-19-law-r5-31
    date: "2023-05-19"
    date_precision: day
    era: 令和5年5月19日
    title: 全世代対応型の持続可能な社会保障制度を構築するための健康保険法等の一部を改正する法律（令和5年法律第31号）公布
    category: 法改正
    summary: 出産育児一時金の後期高齢者医療による支援、前期財政調整の報酬勘案、高齢者負担率の見直しの根拠法。
    detail: |
      スライド76が令和6年度の施行内容として挙げる3項目の根拠法にあたる。
      施行日は公布日・令和6年4月1日・令和8年4月1日に分かれている。
    law: 令和5年法律第31号
    source_slides: [hoken-215-sanko-p076]
    verified_by: e-Gov法令検索（健康保険法の改正沿革。公布 2023-05-19、施行 2023-05-19 / 2024-04-01 / 2026-04-01）
    topics: [出産に係る給付体系の見直し, 保険者間の負担調整, 高齢者負担率の見直し]
    confidence: high
    note: 法律名と法律番号はスライドに記載がないため e-Gov で確認した。

  - id: t-2023-12-22-kaikaku-kotei
    date: "2023-12-22"
    date_precision: day
    era: 令和5年12月22日
    title: 「全世代型社会保障構築を目指す改革の道筋（改革工程）」閣議決定
    category: 閣議決定
    summary: 改革課題を3つの「時間軸」（2024年度／2028年度まで／2040年頃）に割り付けた工程表。
    detail: |
      現在の医療保険部会の議題は、ほぼこの工程表の「2028年度までに検討する取組」から出てくる。
      同工程は、②の取組を2028年度までの各年度の予算編成過程で検討・決定するとしており、
      毎年の予算編成が事実上の実施判断の場になっている。
    document: kaikaku-kotei-2023
    source_slides: [hoken-215-sanko-p083]
    topics: [高齢者負担の在り方, 医療保険における金融所得の勘案, 経済情勢に対応した患者負担等の見直し, 高額療養費制度の見直し]
    confidence: high

