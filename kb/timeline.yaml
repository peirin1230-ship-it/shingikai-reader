  - id: t-2024-zenki-chosei
    date: "2024"
    date_precision: fiscal_year
    era: 令和6年度
    title: 前期高齢者財政調整への報酬水準の勘案（1/3）
    category: 財政調整
    summary: 前期高齢者の財政調整についても、一部（1/3）所得を勘案して調整する方式に変えた。
    detail: |
      後期高齢者支援金で先行した総報酬割の考え方を、前期高齢者財政調整に広げたもの。
      改革工程では「前期財政調整における報酬調整の導入」として
      2024年度に実施する取組に挙げられ、「法改正実施済み」と注記されている（スライド83）。
    law: 令和5年法律第31号
    source_slides: [hoken-215-sanko-p076, hoken-215-sanko-p083]
