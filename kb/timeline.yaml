    title: 老人保健制度の施行（高齢者に定額の一部負担を導入）
    category: 制度創設
    summary: 入院300円/日・外来400円/月の定額負担。無料化から10年で負担導入に転じた。
    source_slides: [hoken-215-sanko-p077]
    topics: [高齢者負担の在り方]
    terms: [老人保健制度]
    confidence: high

  - id: t-1984-hiyosha-honnin-1wari
    date: "1984"
    date_precision: year
    era: 昭和59年
    title: 被用者本人の負担を定額から1割定率へ／特定療養費制度の創設
    category: 患者負担
    summary: 被用者本人が定額負担から1割負担になった。同年、特定療養費制度が創設された。
    detail: |
      特定療養費制度は、保険診療との併用が認められなかった療養について
      将来の保険導入の必要性等の観点から併用を認める仕組みで、
      平成18年に保険外併用療養費制度として再構成された（スライド77の注）。
    source_slides: [hoken-215-sanko-p077]
    terms: [保険外併用療養費]
    confidence: high

  - id: t-1994-10-shokuji-ryoyohi
    date: "1994-10"
    date_precision: month
    era: 平成6年10月
    title: 入院時食事療養費制度の創設
    category: 給付
    summary: 入院時の食費を療養の給付から切り出し、定額の自己負担を導入した。
    detail: |
      現在議論されている「入院時の食費の基準の見直し」（改革工程の2024年度実施項目）は、
      この制度の上での見直しである。
    source_slides: [hoken-215-sanko-p077]
    topics: [経済情勢に対応した患者負担等の見直し]
    confidence: high

  - id: t-1997-09-kaisei
    date: "1997-09"
    date_precision: month
    era: 平成9年9月
    title: 高齢者の定額負担引上げと薬剤一部負担の導入
    category: 患者負担
    summary: 高齢者は入院1,000円/日・外来500円/日（月4回まで）に。被用者本人は入院・外来2割。
    detail: |
      スライド77では、高齢者欄が「→1,000円/日」「→500円/日（月4回まで）＋薬剤一部負担」、
      被用者本人欄が「入院2割／外来2割＋薬剤一部負担」となる。
      ★被用者本人の1割から2割への引上げは、スライド76の「医療保険制度改革の経過」には載っていない。
        同表が平成20年度以降しか扱わないため。
    source_slides: [hoken-215-sanko-p077]
    confidence: high

  - id: t-2001-01-teiritsu-1wari
    date: "2001-01"
    date_precision: month
    era: 平成13年1月
    title: 高齢者の負担を定額から定率1割へ／薬剤一部負担の廃止
    category: 患者負担
    summary: 定率1割負担（月額上限付き、診療所は定額制を選択可）に移行し、高額医療費を創設。
    source_slides: [hoken-215-sanko-p077]
    topics: [高齢者負担の在り方]
    confidence: high

  - id: t-2002-10-genekinami-2wari
    date: "2002-10"
    date_precision: month
    era: 平成14年10月
    title: 高齢者の現役並み所得者2割負担／3歳未満の乳幼児2割
    category: 患者負担
    summary: 高齢者に所得に応じた区分（現役並み所得者2割）が入り、乳幼児負担が軽減された。
    detail: |
      同時に若人の薬剤一部負担が廃止された。3歳未満の乳幼児2割は平成20年4月に
      義務教育就学前まで範囲が拡大される（スライド77の注）。
      高齢者の負担に「所得」の軸が入った最初の改正であり、
      令和4年10月の一定以上所得者2割負担まで同じ考え方が延長されていく。
    source_slides: [hoken-215-sanko-p077]
    topics: [高齢者負担の在り方]
    terms: [現役並み所得者]
    confidence: high

  - id: t-2003-04-honnin-3wari
    date: "2003-04"
    date_precision: month
    era: 平成15年4月
    title: 被用者本人3割負担
    category: 患者負担
    summary: 被用者本人の負担が2割から3割になり、若人の負担が3割に揃った。
    source_slides: [hoken-215-sanko-p077]
    confidence: high

  - id: t-2006-10-hokengai-heiyo
    date: "2006-10"
    date_precision: month
    era: 平成18年10月
    title: 高齢者の現役並み所得者3割／入院時生活療養費・保険外併用療養費の創設
    category: 患者負担
    summary: 現役並み所得者が3割になり、若人と同水準に。特定療養費は保険外併用療養費に再構成。
    source_slides: [hoken-215-sanko-p077]
    terms: [保険外併用療養費, 現役並み所得者]
    confidence: high

  # ========================= 後期高齢者医療制度 =========================
  - id: t-2008-04-kouki-koureisha
    date: "2008-04"
    date_precision: month
    era: 平成20年4月／平成20年度
    title: 後期高齢者医療制度の創設
    category: 制度創設
    summary: 高齢者医療費を公費・現役世代の支援金・高齢者の保険料の3者で支える制度を創設。
    detail: |
      スライド76は「高齢化により増え続ける高齢者医療費を、公費、現役世代（保険者）の支援金、
      高齢者の保険料で支える高齢者医療制度を創設」と記載する。
      窓口負担は75歳以上1割（現役並み所得者3割）、70〜74歳2割（現役並み所得者3割）、
      70歳未満3割（義務教育就学前2割）（スライド77）。
      ★70〜74歳の2割負担は導入後に凍結され、実際に適用が始まるのは平成26年度からである
        （スライド76の平成26年度欄「新たに70歳になる方から2割負担」がそれにあたる）。
      この制度の「公費・支援金・保険料」という財源構成が、以後の改革論点
      （高齢者負担率、総報酬割、現役世代の負担軽減）のすべての前提になる。
    source_slides: [hoken-215-sanko-p076, hoken-215-sanko-p077]
    topics: [高齢者負担の在り方, 世代間の負担の公平, 現役世代の負担軽減]
    terms: [後期高齢者医療制度, 後期高齢者支援金]
    confidence: high

  - id: t-2010-sohoshuwari
    date: "2010"
    date_precision: fiscal_year
    era: 平成22年度
    title: 後期高齢者支援金への総報酬割の導入（1/3）
    category: 財政調整
    summary: 支援金の配分を頭割だけでなく一部（1/3）所得を勘案する方式に変えた。
    detail: |
      報酬水準の高い保険者ほど支援金の負担が重くなる。健保組合の負担が増え、
      協会けんぽの負担が減る方向に働くため、保険者間の利害が正面から対立する論点である。
    source_slides: [hoken-215-sanko-p076]
    topics: [保険者間の負担調整, 現役世代の負担軽減]
    terms: [総報酬割, 後期高齢者支援金]
    confidence: high

  - id: t-2014-kogaku-saibunka
    date: "2014"
    date_precision: fiscal_year
    era: 平成26年度
    title: 高額療養費の所得区分細分化（70歳未満）と70〜74歳の2割負担開始
    category: 患者負担
    summary: 現役世代（70歳未満）の所得区分を細分化。新たに70歳になる者から2割負担。
    detail: |
      スライド76はこの2つを同じ年度の改正として並べ、「（70〜74歳の2割負担導入と同時に改正）」
      と明記している。負担増と高額療養費の見直しを同時に動かす組み方がここに表れている。
      平成26年3月末までに70歳に達している者は1割に据え置かれた（スライド77）。
    source_slides: [hoken-215-sanko-p076, hoken-215-sanko-p077]
    topics: [高額療養費制度の見直し, 高齢者負担の在り方]
    terms: [高額療養費]
    confidence: high

  - id: t-2017-zenmen-sohoshuwari
    date: "2017"
    date_precision: fiscal_year
    era: 平成29年度
    title: 支援金の全面総報酬割／70歳以上の高額療養費の限度額引上げ
    category: 財政調整
    summary: 所得を勘案する範囲を段階的に拡大し、平成29年度から全面総報酬割になった。
    detail: |
      同年度の制度改正による社会保障関係費の減は計▲1,400億円で、その内訳に
      「介護納付金の総報酬割の導入（▲440億円）」「高額療養費の見直し（▲220億円）」
      「協会けんぽ国庫補助の見直し（▲320億円）」等が挙げられている（スライド75）。
    source_slides: [hoken-215-sanko-p076, hoken-215-sanko-p075]
    topics: [保険者間の負担調整, 高額療養費制度の見直し]
    terms: [総報酬割]
    confidence: high

