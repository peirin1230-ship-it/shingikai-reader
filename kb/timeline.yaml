# 医療保険制度 改正年表
#
# 初期データは第215回 参考資料「基礎資料」の以下4枚から起こした（SPEC §2.5 / v0.1）。
#   hoken-215-sanko-p075  社会保障関係費の伸び
#   hoken-215-sanko-p076  医療保険制度改革の経過について（平成20年度〜令和8年度）
#   hoken-215-sanko-p077  医療保険制度の患者一部負担の推移（昭和47年〜令和4年）
#   hoken-215-sanko-p082  健康保険法等の一部を改正する法律（令和8年法律第31号）の概要
#   hoken-215-sanko-p083  改革工程（令和5年12月22日閣議決定）の概要
#
# そのうえで、骨太の方針2026（令和8年7月21日閣議決定）が置いた期限を追加してある。
# 出どころが基礎資料ではない項目には document: を入れて区別できるようにした。
#
# 各項目の意味
#   date_precision : day | month | year | fiscal_year  日付をどこまで特定できているか
#                    fiscal_year は「令和6年度」のように年度でしか書かれていないもの
#   source_slides  : この事実の出どころ。スライドに書かれていないことは書かない
#   confidence     : high   スライドに明記されている、または一次情報で確認した
#                    medium スライドの記載を補足したが、補足部分の裏取りが未了
#   verified_by    : スライド以外で裏を取った場合のその出どころ
#
# ★この年表に載っているのは「基礎資料に載っている改正」だけである。
#   スライド76は事務局が選んだ抜粋であり、平成9年・平成15年の被用者本人負担引上げなど
#   制度史として重要な改正がいくつも省かれている（p076 の解説 §7 を参照）。

entries:

  # ========================= 老人医療費無料化以前 =========================
  - id: t-1972-before
    date: "1972-12"
    date_precision: month
    era: 〜昭和47年12月
    title: 老人医療費支給制度前の患者負担
    category: 患者負担
    summary: 高齢者に固有の給付はなく、国保3割・被用者本人 定額負担・被用者家族5割。
    source_slides: [hoken-215-sanko-p077]
    confidence: high

  # ========================= 老人医療費支給制度 =========================
  - id: t-1973-01-rojin-iryohi
    date: "1973-01"
    date_precision: month
    era: 昭和48年1月
    title: 老人医療費支給制度（老人福祉法）施行
    category: 制度創設
    summary: 高齢者の一部負担を公費で肩代わりし、窓口負担を「なし」とした。
    detail: |
      スライド77の高齢者欄は昭和48年1月から昭和58年1月までを「なし」と記載している。
      この期間の高齢者無料化が、のちの老人保健制度（定額負担の導入）と
      後期高齢者医療制度（独立制度化）へつながる出発点になる。
    source_slides: [hoken-215-sanko-p077]
    topics: [高齢者負担の在り方]
    confidence: high

  - id: t-1973-kogaku-ryoyohi
    date: "1973"
    date_precision: year
    era: 昭和48年
    title: 高額療養費制度の創設
    category: 制度創設
    summary: 国保・被用者本人・被用者家族のいずれにも高額療養費が創設された。
    detail: |
      スライド77では若人の3欄すべてに「高額療養費創設（S48〜）」と記載されている。
      自己負担割合の引上げと高額療養費の拡充が対で動く構図は、この時点から始まっている。
    source_slides: [hoken-215-sanko-p077]
    topics: [高額療養費制度の見直し]
    terms: [高額療養費]
    confidence: high

  - id: t-1981-hiyosha-kazoku-nyuin
    date: "1981"
    date_precision: year
