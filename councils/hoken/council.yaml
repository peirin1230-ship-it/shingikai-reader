description: |
  医療保険制度の在り方を審議する社会保障審議会の部会。診療報酬の点数設定そのものは
  中央社会保険医療協議会（中医協）が扱うため、ここでは給付と負担の制度設計
  （患者負担割合、高額療養費、保険者間の財政調整、保険料の算定など）が主題になる。

# この会議体で頻出し、他会議体と共有される用語の目安
