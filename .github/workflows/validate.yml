name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyyaml

      - name: poppler と webp を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp

      - name: 原典PDFのキャッシュ
        uses: actions/cache@v4
        with:
          path: source
          key: source-${{ hashFiles('councils/*/*/manifest.yaml') }}

      - name: 原典PDFの取得とSHA256の検証
        run: python build/fetch.py --all

      # 数値の突合には抽出テキストが要る。PRの検証では画像は使わないが、
      # extract.py はテキストと画像をまとめて作るのでそのまま走らせる
      - name: 画像とテキストへの分解
        run: python build/extract.py --all

      - name: 検証（ERRORがあれば失敗）
        run: python build/validate.py --all

      - name: サイトが生成できることの確認
        run: python build/build.py --out dist
