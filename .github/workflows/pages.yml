name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に1つだけ。走行中のものは終わらせてから次を流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pythonの依存を入れる
        run: pip install pyyaml

      - name: poppler と webp を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils webp

      # 原典PDFはリポジトリに置いていないので毎回取りにいくことになる。
      # manifest.yaml の中身（＝URLとSHA256）をキーにしてキャッシュし、
      # 厚労省のサーバーへの取得を必要なときだけにする（SPEC §1.1）
      - name: 原典PDFのキャッシュ
        uses: actions/cache@v4
        with:
          path: source
          key: source-${{ hashFiles('councils/*/*/manifest.yaml') }}

      - name: 原典PDFの取得とSHA256の検証
        run: python build/fetch.py --all

      - name: 画像とテキストへの分解
        run: python build/extract.py --all

      - name: 検証
        run: python build/validate.py --all

      - name: サイトの生成
        run: python build/build.py --out dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
